<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Piano Coach">
<title>Piano Coach</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<style>
  :root {
    --bg: #0b0b0f; --card: #17171d; --card2: #202028; --ink: #f2f2f7; --muted: #9a9aa6; --line: #2c2c36;
    --accent: #ff9f0a; --rh: #ff9f0a; --lh: #0a84ff; --ok: #30d158; --bad: #ff453a; --meh: #5a5a66;
    --mapc: #bf5af2; --mapd: #64d2ff;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; font-size: 17px; line-height: 1.4; }
  body { padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  #app { max-width: 560px; margin: 0 auto; padding: 12px 14px 40px; }
  h1 { font-size: 30px; margin: 0; letter-spacing: -0.02em; }
  h2 { font-size: 22px; margin: 0 0 6px; letter-spacing: -0.01em; }
  h3 { font-size: 17px; margin: 0 0 4px; }
  p { margin: 6px 0; }
  .muted { color: var(--muted); }
  .small { font-size: 14px; }
  .tiny { font-size: 12px; }
  .center { text-align: center; }
  .top { display: flex; justify-content: space-between; align-items: flex-start; padding: 14px 4px 10px; }
  .top p { margin: 2px 0 0; }
  .icon { background: var(--card); color: var(--ink); border: 0; border-radius: 50%; width: 42px; height: 42px; font-size: 20px; }
  .bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 2px 10px; position: sticky; top: 0; background: var(--bg); z-index: 5; }
  .back { background: none; border: 0; color: var(--accent); font-size: 17px; padding: 8px 4px; }
  .card { background: var(--card); border-radius: 22px; padding: 18px; margin: 12px 0; }
  .card.big { padding: 20px 18px; }
  .card.hot { box-shadow: 0 0 0 2px var(--accent) inset; }
  .tip { background: #1d2a3a; color: #cfe4ff; border-radius: 16px; padding: 12px 14px; font-size: 15px; margin: 6px 0; }
  .row { display: flex; align-items: center; gap: 12px; }
  .between { justify-content: space-between; }
  .row.center { justify-content: center; gap: 18px; flex-wrap: wrap; }
  .btn { appearance: none; border: 0; border-radius: 999px; padding: 13px 20px; font-size: 17px; font-weight: 600; color: var(--ink); background: var(--card2); min-height: 48px; }
  .btn.primary { background: var(--accent); color: #1a1000; }
  .btn.ghost { background: var(--card2); }
  .btn.big { padding: 16px 26px; font-size: 19px; min-height: 56px; flex: 1; }
  .btn.danger { color: var(--bad); }
  .btn.picked { background: var(--ink); color: var(--bg); }
  .btn:active { transform: scale(0.97); }
  .link { background: none; border: 0; color: var(--accent); font-size: 15px; padding: 10px 4px; text-decoration: underline; text-underline-offset: 3px; }
  .actions { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
  .actions .btn { flex: 1; }
  .actions.dim { opacity: 0.45; }
  .why { font-size: 20px; font-weight: 600; line-height: 1.35; margin: 4px 0 12px; }
  .task { font-size: 17px; color: #d8d8e0; margin: 12px 0 6px; }
  .hint { margin-top: 10px; }
  .kbwrap { margin: 10px -4px 4px; }
  svg.kb { width: 100%; height: auto; display: block; }
  .kw { fill: #f4f4f6; stroke: #1c1c22; stroke-width: 1; }
  .kb-black { fill: #1c1c22; stroke: #000; stroke-width: 1; }
  .kw.rh { fill: #ffd9a0; } .kb-black.rh { fill: #b86e00; }
  .kw.lh { fill: #a9cfff; } .kb-black.lh { fill: #0a4fa0; }
  .kw.on { fill: #ffd9a0; } .kb-black.on { fill: #b86e00; }
  .kw.mapc { fill: #e6c4fb; } .kw.mapd { fill: #c4eeff; }
  .kw.bad { fill: #ffb3ad; } .kb-black.bad { fill: #a3271f; } .kbadge.bad { fill: var(--bad); }
  .kbadge { stroke: none; }
  .kbadge.rh, .kbadge.on { fill: var(--rh); } .kbadge.lh { fill: var(--lh); }
  .kbadge.mapc { fill: var(--mapc); } .kbadge.mapd { fill: #0aa7d9; }
  .kbadget { fill: #fff; font: 700 13px -apple-system, system-ui, sans-serif; text-anchor: middle; }
  .kl { fill: #8a8a96; font: 600 10px -apple-system, system-ui, sans-serif; text-anchor: middle; }
  .kmid { fill: var(--accent); }
  .count { font-size: 88px; font-weight: 800; text-align: center; line-height: 1; margin: 18px 0 6px; font-variant-numeric: tabular-nums; }
  .go { font-size: 42px; font-weight: 800; text-align: center; color: var(--ok); margin: 8px 0; }
  .pulse { display: flex; flex-direction: column; align-items: center; gap: 4px; margin: 6px 0; }
  .pulse b { width: 86px; height: 86px; border-radius: 50%; display: grid; place-items: center; font-size: 44px; font-weight: 800;
    background: var(--card2); color: var(--ink); transition: transform 0.08s, background 0.2s; }
  .pulse b.one { background: #1f3d29; color: #7dfc9c; }
  .pulse b.hit { animation: hit 0.28s ease-out; }
  @keyframes hit { 0% { transform: scale(1.18); } 100% { transform: scale(1); } }
  .dots { display: flex; justify-content: center; align-items: center; gap: 8px; margin: 10px 0; flex-wrap: wrap; }
  .dots i { width: 16px; height: 16px; border-radius: 50%; background: var(--meh); transition: background 0.15s; }
  .dots i.on { background: var(--ok); }
  .dots b { color: var(--muted); font-size: 14px; }
  .meter { height: 6px; background: var(--card2); border-radius: 3px; overflow: hidden; margin: 10px 0 14px; }
  .meter i { display: block; height: 100%; width: 0; background: var(--ok); transition: width 0.15s; }
  .stage .btn { width: 100%; }
  .listening { font-size: 18px; color: var(--muted); padding: 18px 0; }
  .result { border-radius: 16px; padding: 14px; margin-top: 12px; background: var(--card2); }
  .result.good { box-shadow: 0 0 0 2px var(--ok) inset; }
  .result.fix { box-shadow: 0 0 0 2px var(--bad) inset; }
  .result.ask { box-shadow: 0 0 0 2px var(--accent) inset; }
  .verdict { font-size: 18px; font-weight: 600; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
  .chip { min-width: 34px; text-align: center; padding: 6px 8px; border-radius: 10px; font-weight: 700; font-size: 15px; background: var(--meh); }
  .chip.ok { background: rgba(48, 209, 88, 0.22); color: #7dfc9c; }
  .chip.bad { background: rgba(255, 69, 58, 0.28); color: #ff9a92; }
  .chip.meh { background: #2a2a33; color: #8a8a96; }
  .streak { display: flex; align-items: center; gap: 8px; margin: 10px 0 4px; }
  .streak i { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--ok); }
  .streak i.on { background: var(--ok); }
  .pips { display: flex; align-items: center; gap: 7px; margin: 10px 0 2px; }
  .pip { width: 12px; height: 12px; border-radius: 50%; background: var(--meh); }
  .pip.locked { background: none; border: 2px solid var(--ok); }
  .pip.learned { background: var(--ok); }
  .now { font-size: 96px; font-weight: 800; text-align: center; line-height: 1.05; }
  .results { list-style: none; padding: 0; margin: 8px 0; }
  .results li { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .results li:last-child { border-bottom: 0; }
  .badge { font-size: 13px; font-weight: 700; padding: 5px 10px; border-radius: 999px; white-space: nowrap; }
  .badge.ok { background: rgba(48, 209, 88, 0.22); color: #7dfc9c; }
  .badge.bad { background: rgba(255, 69, 58, 0.28); color: #ff9a92; }
  .badge.meh { background: #2a2a33; color: #9a9aa6; }
  .ask p { font-weight: 600; margin-top: 14px; }
  .warn { background: #3a1d1d; color: #ffc9c4; border-radius: 14px; padding: 12px 14px; }
  select { width: 100%; font-size: 16px; padding: 12px; border-radius: 12px; background: var(--card2); color: var(--ink); border: 1px solid var(--line); margin: 8px 0; }
  .copybox { width: 100%; height: 160px; margin-top: 12px; background: var(--card2); color: var(--ink); border-radius: 12px; padding: 10px; font-size: 13px; }
  .foot { text-align: center; margin-top: 24px; }
  #toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(20px); background: #2c2c36; color: var(--ink); padding: 12px 18px; border-radius: 14px; font-size: 15px; opacity: 0; transition: all 0.25s; pointer-events: none; max-width: 90%; text-align: center; }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  [hidden] { display: none !important; }
  noscript p { padding: 24px; }
</style>
</head>
<body>
<div id="app"><p class="muted center" style="padding-top:40vh">Loading…</p></div>
<noscript><p>Piano Coach needs JavaScript turned on.</p></noscript>
<script type="module" src="js/app.js?v=0.2"></script>
</body>
</html>
